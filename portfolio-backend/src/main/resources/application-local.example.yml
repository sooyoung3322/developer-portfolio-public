# Copy to application-local.yml (ignored by Git).
# Supply credentials through environment variables; never commit real values.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio_demo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate

analytics:
  enabled: true
